.top,.nav{box-shadow:0 6px 16px rgba(20,24,48,.2),inset 0 -2px 0 rgba(255,255,255,.7)}.nav{box-shadow:0 -6px 16px rgba(20,24,48,.2),inset 0 2px 0 rgba(255,255,255,.7)}
.btn.bpdf{background:linear-gradient(180deg,#ff6b6b,#d62828);color:#fff;border-color:#a01919;box-shadow:0 3px 0 #8a1212,0 7px 10px rgba(0,0,0,.2)}
.btn.bword{background:linear-gradient(180deg,#5b9bff,#1e5fd6);color:#fff;border-color:#174aa8;box-shadow:0 3px 0 #123a85,0 7px 10px rgba(0,0,0,.2)}
.dchart{width:100%;height:auto;margin-top:10px;direction:ltr}.dchart text{font:10px Tahoma,sans-serif;fill:currentColor}.dnote{font-size:.75em;opacity:.75;margin:4px 0 0;text-align:center}

/* ===== v4 ===== */
#app{top:0;bottom:auto;height:100vh;height:100dvh;height:var(--vh,100dvh)}
.paper::before{content:"";position:absolute;left:16px;right:16px;top:16px;bottom:16px;border:2.5px solid #000;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4px #555;pointer-events:none;z-index:1}
.stepper{display:flex;align-items:center;direction:rtl;margin:2px 4px 12px}
.stepper .dot{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:.85em;background:rgba(255,255,255,.85);border:2px solid #9aa0b0;color:#555;transition:all .35s}
.stepper .dot svg{width:16px;height:16px;stroke-width:3}
.stepper .dot.d{background:#16a34a;border-color:#15803d;color:#fff}
.stepper .dot.c{background:#111;border-color:#000;color:#fff;transform:scale(1.18);box-shadow:0 0 0 4px rgba(0,0,0,.14),0 0 14px rgba(0,0,0,.35)}
.stepper u{flex:1;min-width:4px;height:3px;background:#b8bdcc;transition:background .4s;text-decoration:none}
.stepper u.d{background:#111}

/* ===== v2: galaxy theme, motion, footer wordmark ===== */
#app{background:radial-gradient(120% 55% at 85% -8%,#fff 0,#eceef2 42%,transparent 70%),radial-gradient(90% 45% at 8% 108%,#d6d9e1 0,transparent 65%),linear-gradient(170deg,#f4f5f8,#dcdee5 60%,#eef0f4)!important;transition:background .5s}
#app.gx-dark{background:radial-gradient(100% 50% at 80% 0,#5a5e6b 0,#33363e 45%,transparent 75%),radial-gradient(90% 50% at 10% 105%,#4a4d58 0,transparent 65%),linear-gradient(170deg,#3a3d45,#1d1f24)!important}
#app::before,#app::after,.splash::before,.splash::after{content:"";position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%;pointer-events:none;z-index:0}
#app::before{box-shadow:var(--s1);animation:tw 5s ease-in-out infinite alternate}#app::after{box-shadow:var(--s2);animation:tw 7s 1.5s ease-in-out infinite alternate}
#app.gx-dark::before,.splash::before{box-shadow:var(--w1)}#app.gx-dark::after,.splash::after{box-shadow:var(--w2)}
@keyframes tw{from{opacity:.3}to{opacity:1}}
#app>.top,#app>#main,#app>.nav{position:relative;z-index:1}
#app>.top,#app>.nav{background:rgba(255,255,255,.86)!important}#main{background:transparent!important}
#app>#main.pgin{animation:pgin .38s cubic-bezier(.2,.8,.2,1)}@keyframes pgin{from{opacity:0;transform:translateY(16px)}}
.card{box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(20,22,30,.06)}
.big{background:linear-gradient(135deg,#0f1013,#2b2d34)!important}
.splash{background:radial-gradient(90% 50% at 50% 38%,#5b5f6c,#2a2c33 58%,#131417)!important;color:#fff!important}
.splash .brand .vl{background:#fff!important}.splash .brand .en{letter-spacing:1px;text-shadow:0 0 18px rgba(255,255,255,.35)}
.splash p{opacity:0;animation:fi 1s .9s forwards;color:#dfe1e8}
.stepper u{background:#111!important;opacity:.22}.stepper u.d{opacity:1}
.stepper .dot.d{background:#16a34a!important;border-color:#16a34a!important;color:#fff!important;transition:all .3s}
.stepper .dot:not(.d):not(.on){border-color:#111}
.wmk{direction:ltr;text-align:center;margin:30px 0 10px;user-select:none}
.wmk div{display:flex;justify-content:center;align-items:center;gap:12px}
.wmk .en{font:800 2.1em/1 system-ui,"Segoe UI",Arial,sans-serif;color:#15171e;letter-spacing:.5px}
.wmk i{width:2px;height:34px;background:#15171e}.wmk .fa{font-weight:800;font-size:2.1em;color:#15171e}
.wmk small{display:block;margin-top:8px;direction:rtl;color:#6b6f7c;font-size:.78em}
.dev{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.dev .av{width:64px;height:64px;flex:none;border-radius:50%;background:#15171e;color:#fff;display:grid;place-items:center;font:800 1.5em system-ui;box-shadow:0 0 0 3px #fff,0 0 0 4px #15171e}
@media(prefers-reduced-motion:reduce){#app::before,#app::after,#app>#main.pgin{animation:none}}

/* ===== v3: light splash + avatar ===== */
#app .splash{background:radial-gradient(60% 34% at 14% 8%,#fff 0,rgba(255,255,255,0) 100%),radial-gradient(55% 30% at 92% 32%,#dcd8ec 0,rgba(220,216,236,0) 100%),radial-gradient(60% 28% at 12% 98%,#f3f4f8 0,rgba(243,244,248,0) 100%),linear-gradient(170deg,#a9adbf,#c9ccd9 40%,#d3d6e2 70%,#b9bdcc)!important;color:#15171e!important;overflow:hidden;transition:opacity .45s,transform .45s}
#app .splash.out{opacity:0;transform:scale(1.04)}
#app .splash .glow{position:absolute;width:380px;height:380px;left:-120px;top:-120px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,255,255,0));animation:gdr 6s ease-in-out infinite alternate}
@keyframes gdr{to{transform:translate(200px,300px) scale(1.2);opacity:.7}}
#app .splash::before,#app .splash::after{z-index:0}#app .splash::before{animation:tw 3s ease-in-out infinite alternate}#app .splash::after{animation:tw 4.5s 1s ease-in-out infinite alternate}
#app .splash .lg{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:min(92%,340px);height:180px}
#app .splash .orb{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:orbin 1.2s .1s both}
#app .splash .orb ellipse{fill:none;stroke:rgba(21,23,30,.28);stroke-width:1;stroke-dasharray:960;stroke-dashoffset:960;animation:draw 1.9s .3s cubic-bezier(.4,.1,.2,1) forwards}
#app .splash .orb ellipse+ellipse{animation-delay:.6s;stroke:rgba(255,255,255,.9)}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes orbin{from{opacity:0;transform:scale(.7) rotate(-20deg)}}
#app .splash .brand{position:relative;z-index:1;animation:none;gap:12px}
#app .splash .brand .en{display:flex;font:800 2.1em/1 system-ui,"Segoe UI",Arial,sans-serif;color:#15171e;text-shadow:none;letter-spacing:0}
#app .splash .brand .en span{display:inline-block;animation:lt .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.5s + var(--i)*.07s)}
@keyframes lt{from{opacity:0;transform:translateY(22px) scale(.8);filter:blur(7px)}}
#app .splash .brand .vl{background:#15171e!important;transform-origin:center;animation:gl .7s 1.15s cubic-bezier(.2,.8,.2,1) both}
#app .splash .brand .fa{animation:fa .9s 1.35s cubic-bezier(.2,.8,.2,1) both}
@keyframes fa{from{opacity:0;transform:translateX(24px);filter:blur(6px)}}
#app .splash p{position:relative;z-index:1;margin-top:6px;color:#3a3d4a;opacity:0;animation:fi .9s 1.9s forwards}
#app .splash .sbar{position:absolute;bottom:calc(46px + env(safe-area-inset-bottom));left:50%;width:120px;height:3px;margin-left:-60px;border-radius:3px;background:rgba(21,23,30,.12);overflow:hidden;opacity:0;animation:fi .5s 1.2s forwards}
#app .splash .sbar i{display:block;height:100%;width:100%;background:#15171e;border-radius:3px;transform-origin:left;animation:sb 1.6s 1.3s cubic-bezier(.5,0,.2,1) both}
@keyframes sb{from{transform:scaleX(0)}}
.dev{margin-top:14px}
.dev .av{width:38px;height:38px;min-width:38px;max-width:38px;flex:none;border-radius:50%;object-fit:cover;object-position:center 25%;aspect-ratio:1/1;display:block;background:#e8e9ef;box-shadow:0 0 0 2px #fff,0 0 0 3px #15171e}
@media(prefers-reduced-motion:reduce){#app .splash *{animation-duration:.01s!important;animation-delay:0s!important}}

/* ===== perf layer (rendering cost only; visual result unchanged) ===== */
/* twinkle/glow: same curve, quantised into tiny steps (<=3% opacity per step) -> far fewer repaints of the backdrop-filter layers below */
#app::before{animation-timing-function:steps(28)}#app::after{animation-timing-function:steps(28)}
.dz.g6{animation-timing-function:ease,steps(24)}
.dz.g6::before{animation-timing-function:steps(16)}
/* opt-in lite mode (NOT enabled by default): add class="lite" to <html> to drop card backdrop blur on very weak devices */
html.lite .card,html.lite .top,html.lite .nav{-webkit-backdrop-filter:none;backdrop-filter:none}

/* ===== v5: Iranian exam layout ===== */
.rw{display:flex;direction:rtl;border:1px solid #000;border-top:0;padding:0!important;position:relative}
.rw.hr{border-top:1px solid #000;font-weight:700;background:#f2f2f2;text-align:center;font-size:12px}
.rw.sh{border-top:1px solid #000}
.rw .rc{width:34px;flex:none;border-left:1px solid #000;text-align:center;font-weight:700;padding-top:4px}
.rw .lc{width:46px;flex:none;border-right:1px solid #000;text-align:center;font-weight:700;padding-top:4px;font-size:12px}
.rw .mc{flex:1;min-width:0;padding:4px 10px 6px;direction:ltr;text-align:left}
.rw .ins2{direction:rtl;text-align:right;font-size:12.5px;font-weight:700}
.rw.hr .mc{text-align:center}
.bl2{letter-spacing:1px;white-space:nowrap}
.ln{border-bottom:2px dotted #000!important;height:20px;width:82%;margin-top:2px}
.ops{display:flex;justify-content:space-between;gap:6px;margin-top:3px;padding-inline-end:20px}
.mt th{border-bottom:1.5px solid #000;text-align:center;font-weight:700;padding:2px}
.mt td{padding:3px 4px}
.dev .av{object-position:center!important}
.dlg{padding-top:44px!important}.dlgx{position:absolute;top:8px;left:8px;width:32px;height:32px;border:0;border-radius:50%;background:#15171e;color:#fff;font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:2}
.top h1{text-align:left!important;direction:rtl}

/* ============ v3: difficulty chart ============ */
function diffChart(){
 const C=[['چالش','#1c1d23',[10,25,45,65,85,100]],['ریسک افت نمره','#dc2626',[2,8,20,40,65,90]],['رشد یادگیری','#16a34a',[15,35,60,80,70,45]]],X=i=>286-i*(272/5),Y=v=>110-v*.9,d=W.diff-1;
 const g=[0,50,100].map(v=>`<line x1="14" x2="286" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".2"/><text x="292" y="${Y(v)+3}" text-anchor="start">${fa(v)}٪</text>`).join('');
 const ls=C.map(c=>`<polyline fill="none" stroke="${c[1]}" stroke-width="2.5" stroke-linejoin="round" points="${c[2].map((v,i)=>X(i)+','+Y(v)).join(' ')}"/><circle cx="${X(d)}" cy="${Y(c[2][d])}" r="4.5" fill="${c[1]}" stroke="#fff" stroke-width="1.5"/>`).join('');
 const lb=[1,2,3,4,5,6].map((n,i)=>`<text x="${X(i)}" y="128" text-anchor="middle" ${i===d?'font-weight="bold"':''}>${fa(n)}</text>`).join('');
 const lg=C.map(c=>`<span style="color:${W.diff===6&&c[1]==='#1c1d23'?'#e5e7eb':c[1]};font-weight:700">● ${c[0]} ${fa(c[2][d])}٪</span>`).join(' &nbsp; ');
 return`<svg class="dchart" viewBox="0 0 320 136">${g}<line x1="${X(d)}" x2="${X(d)}" y1="8" y2="112" stroke="currentColor" stroke-dasharray="3 3" opacity=".5"/>${ls}${lb}</svg><div class="chips" style="font-size:.85em">${lg}</div><p class="dnote">نمودار برآورد آموزشی است، نه نتیجهٔ آماری: رشد یادگیری در سختی‌های میانی بیشترین و ریسک افت نمره در سختی‌های بالا بیشتر است.</p>`}

const _te=new TextEncoder(),_crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=~0;for(let i=0;i<b.length;i++)c=_crcT[(c^b[i])&255]^(c>>>8);return~c>>>0};
const le=(v,n)=>Array.from({length:n},(_,i)=>(v>>>(8*i))&255);
function zipStore(files){const parts=[],cen=[];let off=0;
 files.forEach(f=>{const nm=_te.encode(f.n),d=_te.encode(f.d),c=crc32(d),h=[...le(0x04034b50,4),...le(20,2),...le(0x0800,2),...le(0,2),...le(0,2),...le(33,2),...le(c,4),...le(d.length,4),...le(d.length,4),...le(nm.length,2),...le(0,2)];
  parts.push(new Uint8Array(h),nm,d);
  cen.push(new Uint8Array([...le(0x02014b50,4),...le(20,2),...le(20,2),...le(0x0800,2),...le(0,2),...le(0,2),...le(33,2),...le(c,4),...le(d.length,4),...le(d.length,4),...le(nm.length,2),...le(0,2),...le(0,2),...le(0,2),...le(0,2),...le(0,4),...le(off,4)]),nm);
  off+=h.length+nm.length+d.length});
 const cs=sum(cen.map(x=>x.length));return new Blob([...parts,...cen,new Uint8Array([...le(0x06054b50,4),...le(0,2),...le(0,2),...le(files.length,2),...le(files.length,2),...le(cs,4),...le(off,4),...le(0,2)])],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}
const xe=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

The match was on Sunday.",0],["Navid's team won.",1]]},{"l":4,"t":"The Village Well","x":"Long ago, a small village had only one well, and it was almost dry. The villagers argued every day about the little water left. One night, a young girl named Roya had an idea. She suggested that everyone should dig a new well together. At first, people laughed at her, but an old farmer supported the plan. After three weeks of hard work, they found fresh water under the hill. From that day, nobody argued again, and the village grew rich and peaceful.","q":[["Why did the villagers argue?","The water was almost finished",["The well was too far","The farmer was angry","The girl laughed"]],["What was Roya's idea?","To dig a new well together",["To leave the village","To sell the water","To close the old well"]],["Who supported the plan first?","An old farmer",["The girl's mother","All the villagers","A teacher"]],["How did the story end?","The village became peaceful",["The well became dry","Roya left","The farmer moved away"]]],"f":[["The villagers agreed with Roya at once.",0],["The work took about three weeks.",1]]},{"l":4,"t":"Trapped in the Snow","x":"Farhad and his brother were driving to their grandmother's house when a heavy snowstorm began. Soon, the road disappeared and the car slid into a ditch. There was no phone signal. They decided to stay in the car and wait, because walking in the storm was dangerous. They shared a small bag of nuts and wrapped themselves in a blanket. Early next morning, they heard an engine. A rescue team had seen the car's lights. Both brothers were cold but safe.","q":[["Why did they stay in the car?","Walking in the storm was dangerous",["The car was warm","They were sleepy","They wanted to sleep"]],["What could they NOT do?","Call for help",["Eat something","Use the car's lights","Stay together"]],["How did the rescue team find them?","They saw the car's lights",["They got a phone call","They followed footprints","They heard shouting"]],["How were the brothers at the end?","Cold but safe",["Hurt","Angry","Hungry and sick"]]],"f":[["They were going to their grandmother's house.",1],["They had a lot of food.",0]]},{"l":5,"t":"The Desert Journey","x":"When Dana decided to cross the desert with a caravan, her family thought she was foolish. The journey lasted twelve days, and the temperature reached forty-five degrees at noon. Travelling at night was easier because the stars guided them. On the ninth day, a sandstorm forced everyone to stop, and their water supply nearly ran out. It was Dana who noticed the camels turning toward the east; they could smell a distant oasis. Following them saved the whole group. Afterwards, the leader admitted that she understood the desert better than any of the men.","q":[["Why did the caravan travel at night?","It was cooler and easier",["The camels were sleepy","There was no sand","The leader was afraid"]],["What happened on the ninth day?","A sandstorm stopped them",["They reached the oasis","They lost the camels","Dana went home"]],["How did Dana save the group?","She followed the camels' direction",["She found a map","She carried water","She called her family"]],["What does the leader's last comment show?","He respected Dana's skill",["He was angry","He wanted to go home","He was jealous"]]],"f":[["The trip took twelve days.",1],["Dana's family supported her plan.",0]]},{"l":5,"t":"The Clockmaker","x":"In a narrow street of an old city lived a clockmaker who never smiled. People believed he was bitter because his son had left years before. One winter, a boy brought him a broken pocket watch, saying it had belonged to his grandfather. The clockmaker examined it in silence and, to the boy's surprise, refused to be paid. He worked on it for a week, and when the boy returned, the watch was ticking perfectly. Inside the case, the boy discovered a tiny photograph: it showed the clockmaker as a young man beside a smiling child. Only then did they both realize that the watch had readingQs=function(r,L,k){
 const pool=STORIES.filter(s=>Math.abs(s.l-L)<=1);
 if(!pool.length||r()<.15)return _rq(r,L,k);
 const s=R.pick(r,pool),mc=q=>({type:'mcq',stem:q[0],answer:q[1],choices:ord(r,[q[1],...q[2]])});
 const c=[...s.q.map(mc),...s.f.map(f=>({type:'tf',stem:f[0],answer:f[1]?'True':'False'}))];
 const qs=R.shuf(r,c).slice(0,k).map(q=>({...q,level:L,topic:'reading',key:s.x+q.stem}));
 return{passage:{title:s.t,text:s.x},qs}};
}

e world. There are more than 2000 languages in Africa, 1000 in the Americas, more than 2250 in Asia, about 230 in Europe, and more than 1300 in Oceania. Native speakers of these languages range in number from very large, with hundreds of millions of speakers, to very small, with fewer than 10 speakers. The most popular language in the world is Chinese. More than one billion people in the world speak Chinese."},{"t":"Reading","x":"An endangered language is a language that has very few speakers. Nowadays, many languages are losing their native speakers. When a language dies, the knowledge and culture disappear with it. A lot of endangered languages are in Australia and South America. Some of them are in Asia and Africa. The number of live languages of the world is around 7000, and many of them may not exist in the future. Many researchers are now trying to protect endangered languages. This can save lots of information and cultural values of people all around the world."},{"t":"Reading","x":"There are many uncountable words for food in English. Native speakers often use words such as 'a bag of, 'two slices of', or 'a piece of' with uncountable nouns. This usually happens when they go shopping. They may ask for two bottles of water, a bag of sugar, a loaf of bread, or two kilos of meat. In a coffee shop, they may order a cup of tea, a piece of cake, or a glass of juice. If a foreign learner uses uncountable words wrongly, English speakers may not understand them well. So when you learn English, be very careful about this important point."},{"t":"Reading","x":"What does the first sentence say about Mahan? Mahan is sleeping. What does the second sentence say about the bird? The bird does not sing. What does the third sentence say about the apple? The apple fell down. What does the fourth sentence say about the teacher? The teacher is hard-working."},{"t":"Reading","x":"Bad habits and addiction can be harmful to health. One day of smoking can take around 5 hours away from the smoker's life. Addiction to technology such as using computers for a long time is also dangerous. Above all, the most important thing to enjoy a good life is having emotional health. Praying decreases stress and gives people a calm and balanced life. People with this lifestyle have had a better life. There are many other things people can do to live healthier and longer. The key point, however, is having a plan for the way they want to live and take care of their physical and emotional health."},{"t":"Reading","x":"Technology has helped the researchers and scientists of our time. New medicines and medical inventions have saved the lives of many people. They have let people have a happy life and live longer. New medicines such as anti-cancer drugs and new antibiotics have cured many patients. Some technological inventions have helped doctors to check people's health condition. They have found keys to the secrets of the human body. New technologies have helped doctors to understand how diseases develop. They have found ways to fight and stop diseases in their early stages. Technology, as some people may think, is not a bad thing at all. The way we use technology, is important."},{"t":"Reading","x":"Swimming is useful for everyone. Reading helps us learn English. A gerund is always singular. When one gerund is the subject of a sentence, it takes a singular verb. Walking makes me happy. But when two gerunds form the subject, the verb is plural. Cycling and jogging are my favorite sports."},{"t":"Reading","x":"Art, Culture and Society Art is what people create with imagination and skill. As a part of culture, it shows the way of life and identity of a nation and reflects the history of a society. In fact, the history of humankind is the history of art. If we want to know a country or a nation well, we should study its art. Handicrafts are good examples of the art and culture of a country. By handicrafts, we mean making decorative items in a skillful way using our hands. Each country and culture has its own handicrafts. Making and selling handicrafts are good ways to help a country's economy and introduce its culture to other nations. Many people of the world produce handicrafts and sell them to tourists. In some Asian countries a part of the country's income comes from making and selling handicrafts. Iran has a five-thousand-year-old history of artistic works and handicrafts including pottery, painting, calligraphy, rugs and carpets, etc. If you travel across Iran, you'll get back home with excellent handicrafts as souvenirs for your family and friends."},{"t":"Reading","x":"Iranian art is also quite famous all around the world. There are very excellent collections of Persian art in many important museums of the world. If we want to name countries with richest art and cultural diversity, Iran is among them. Persian art is famous in the world for reflecting moral and social values of Iranian people and the natural beauty of this vast country. Iranian craftsmen and craftswomen are famous for producing very unique artworks from wood, metal and other simple materials around them. Many people of the world appreciate the art and skill of a young Iranian girl who weaves a beautiful silk carpet in a small village of Azarbaijan or Kordestan. When tourists buy Persian rugs or carpets, they take a part of Iranian art and culture to their homelands."},{"t":"Reading","x":"Our neighbor is a craftsman. I love his beautiful artworks. Whenever I see his works, I say to myself, \"when I grow up, I will become an artist like him\". One day he told me: \"Amir, are you really interested in art? If you enjoy art, you will become a good artist. Most people like art, but some do not understand it. If you do not see any special thing in a pottery, you won't appreciate its value. If you do not appreciate the value of art, you cannot become a successful artist. You will things in the future: education and experience. Study hard, work hard, and create things to make people happy.\""},{"t":"Reading","x":"Amir is bored with his present job. Mina got amused by the story. I'm totally confused. Would you please explain it again? He often gets depressed about his weight. I'm so excited that we're going to Yazd. To tell the truth, I was frightened to death. I've always been interested in football. They were greatly surprised at the news. I'm tired of watching television; let's go for a walk."},{"t":"Reading","x":"A. We use 'will' with 'if' to talk about what will happen in the future if certain conditions are met at the present time. We want to buy a new store. Really, what for? We want to make and sell more pottery work. I've heard people are really interested in your work. Yeah, if everything goes well, we will open the new store in June."},{"t":"learn","x":"Hint We make negative infinitives with not + to + verb. I told the children not to make so much noise. My dad tries not to forget the phone numbers. We can use infinitives after some adjectives. She became happy to see her classmate after ten years. Ali was really sad to leave us soon."},{"t":"Conversation","x":"Tourist: I'd like to buy a Persian carpet, but it seems too expensive. Reza: The price depends on its size. Instead, you can take an Isfahan Termeh or a Qashqai Gabbeh. Tourist: Wow! How touching this Gabbeh is! How much is it? Reza: It is 85 dollars."},{"t":"Conversation","x":"Tourist: Well, I'll take both. Please pack them for me. Reza: Yes, sure. Tourist: Do you work for this shop? Who has made these beautiful items? 85 Reza: Actually, it is my father's workshop and store."},{"t":"Environment 1","x":"She wishes she could speak French. He wishes he had studied harder. If her friend had known the truth, her friend would have helped the new students. English was spoken all over the world. Mina told me that she would learn English words the next day. The letters were sent every morning."},{"t":"Success 1","x":"If Sara had more time, Sara would buy fresh fruit
